# Quick local run: in-memory H2 database (data is lost on restart)
spring.datasource.url=jdbc:h2:mem:inventorydb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# H2 web console at http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:inventorydb)
spring.h2.console.enabled=true
