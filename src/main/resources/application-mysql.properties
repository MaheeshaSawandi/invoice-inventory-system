# MySQL profile. Create the database first:  CREATE DATABASE inventory_db;
# Values can be overridden with environment variables (useful later for Docker).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/inventory_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# To switch to PostgreSQL: add the org.postgresql:postgresql dependency and change the URL to
# jdbc:postgresql://localhost:5432/inventory_db
